# Publishly local dev infrastructure (project-specific ports to avoid collisions
# with other stacks on this machine). Upstream's docker-compose.dev.yaml is kept
# untouched for a clean update path — use THIS file for Publishly development.
#
#   docker compose -f docker-compose.publishly.dev.yaml up -d
#
# Host ports: Postgres 5433, Redis 6380, Temporal 7233, Temporal UI 8082.
# Elasticsearch backs Temporal advanced visibility - required: the app
# registers more Text search attributes than SQL visibility's cap of 3.

services:
  publishly-postgres:
    image: postgres:17-alpine
    container_name: publishly-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: publishly-local-pwd
      POSTGRES_USER: publishly-local
      POSTGRES_DB: publishly-db-local
    volumes:
      - publishly-postgres-volume:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - publishly-network

  publishly-redis:
    image: redis:7-alpine
    container_name: publishly-redis
    restart: always
    ports:
      - 6380:6379
    networks:
      - publishly-network

  publishly-temporal-postgresql:
    container_name: publishly-temporal-postgresql
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - publishly-temporal-network
    expose:
      - 5432
    volumes:
      - publishly-temporal-pg-volume:/var/lib/postgresql/data

  publishly-temporal-elasticsearch:
    container_name: publishly-temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - publishly-temporal-network
    expose:
      - 9200
    volumes:
      - publishly-es-volume:/usr/share/elasticsearch/data

  publishly-temporal:
    container_name: publishly-temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    ports:
      - "7233:7233"
    depends_on:
      - publishly-temporal-postgresql
      - publishly-temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=publishly-temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=publishly-temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - publishly-temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  publishly-temporal-ui:
    container_name: publishly-temporal-ui
    image: temporalio/ui:2.34.0
    restart: always
    depends_on:
      - publishly-temporal
    environment:
      - TEMPORAL_ADDRESS=publishly-temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8082
    networks:
      - publishly-temporal-network
    ports:
      - "8082:8080"

volumes:
  publishly-postgres-volume:
  publishly-temporal-pg-volume:
  publishly-es-volume:

networks:
  publishly-network:
  publishly-temporal-network:
