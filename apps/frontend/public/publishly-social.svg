<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Publishly — Nothing fails silently</title>
  <desc id="description">Publishly gives every social post a delivery receipt, a clear failure reason, and safe retries.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#D9EFFF"/>
    </linearGradient>
    <linearGradient id="receipt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F9FF"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#1878C4" opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071521" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="14" fill="#1878C4"/>
  <path d="M0 500C222 415 357 574 595 488C788 418 964 340 1200 414V630H0Z" fill="#55B0FF" opacity=".11"/>
  <rect x="0" y="14" width="590" height="616" fill="url(#dots)"/>

  <g transform="translate(70 62)">
    <g transform="translate(0 2)">
      <rect x="0" y="0" width="12" height="44" rx="2" fill="#071521"/>
      <path d="M12 5H37C48 5 55 12 55 22S48 39 37 39H12" fill="none" stroke="#071521" stroke-width="10"/>
      <circle cx="37" cy="22" r="7" fill="#55B0FF"/>
    </g>
    <text x="71" y="39" fill="#071521" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.8">Publishly</text>
  </g>

  <g transform="translate(70 151)">
    <rect width="322" height="34" rx="17" fill="#FFFFFF" stroke="#BBDCF4"/>
    <circle cx="20" cy="17" r="6" fill="#24A36A"/>
    <text x="35" y="22" fill="#223544" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">SOCIAL POSTING YOU CAN PROVE</text>
  </g>

  <text x="70" y="268" fill="#071521" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-3.6">Nothing fails</text>
  <text x="70" y="343" fill="#071521" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-3.6">silently. Ever.</text>
  <text x="72" y="402" fill="#223544" font-family="Arial, Helvetica, sans-serif" font-size="23">Delivery receipts. Clear failure reasons. Safe retries.</text>
  <text x="72" y="437" fill="#223544" font-family="Arial, Helvetica, sans-serif" font-size="23">Warnings before an account disconnects.</text>

  <g transform="translate(70 501)">
    <rect width="554" height="58" rx="11" fill="#071521"/>
    <text x="24" y="36" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Flat price</text>
    <circle cx="132" cy="29" r="3" fill="#55B0FF"/>
    <text x="148" y="36" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Unlimited brand, client &amp; location accounts</text>
  </g>

  <g transform="translate(700 63)" filter="url(#shadow)">
    <rect width="430" height="504" rx="22" fill="url(#receipt)" stroke="#A8CFEA"/>
    <rect x="1" y="1" width="428" height="64" rx="21" fill="#071521"/>
    <path d="M1 44H429V65H1Z" fill="#071521"/>
    <text x="24" y="39" fill="#D9EFFF" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="1.5">DELIVERY RECEIPT</text>
    <circle cx="389" cy="31" r="8" fill="#24A36A"/>

    <g transform="translate(24 92)">
      <text x="0" y="15" fill="#5F7180" font-family="Courier New, monospace" font-size="13">POST_8F21</text>
      <rect x="235" y="-4" width="147" height="31" rx="15.5" fill="#DDF7EA"/>
      <circle cx="253" cy="12" r="5" fill="#24A36A"/>
      <text x="266" y="17" fill="#137A4B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">CONFIRMED LIVE</text>
    </g>

    <line x1="44" y1="165" x2="44" y2="324" stroke="#BBDCF4" stroke-width="3"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="44" cy="166" r="8" fill="#1878C4"/>
      <text x="68" y="172" fill="#071521" font-size="17" font-weight="700">Queued</text>
      <text x="340" y="172" fill="#5F7180" font-size="14">10:42:01</text>

      <circle cx="44" cy="219" r="8" fill="#1878C4"/>
      <text x="68" y="225" fill="#071521" font-size="17" font-weight="700">Sent to Instagram</text>
      <text x="340" y="225" fill="#5F7180" font-size="14">10:42:04</text>

      <circle cx="44" cy="272" r="8" fill="#24A36A"/>
      <text x="68" y="278" fill="#071521" font-size="17" font-weight="700">Confirmed live</text>
      <text x="340" y="278" fill="#5F7180" font-size="14">10:42:08</text>

      <circle cx="44" cy="325" r="8" fill="#FFD34D" stroke="#C28A00"/>
      <text x="68" y="331" fill="#071521" font-size="17" font-weight="700">Receipt sent</text>
      <text x="340" y="331" fill="#5F7180" font-size="14">10:42:08</text>
    </g>

    <g transform="translate(24 367)">
      <rect width="382" height="112" rx="12" fill="#EAF6FF" stroke="#BBDCF4"/>
      <text x="17" y="25" fill="#1878C4" font-family="Courier New, monospace" font-size="12" font-weight="700">POST.RECEIPT</text>
      <text x="17" y="52" fill="#223544" font-family="Courier New, monospace" font-size="13">{ "status": "confirmed_live",</text>
      <text x="17" y="75" fill="#223544" font-family="Courier New, monospace" font-size="13">  "provider": "instagram",</text>
      <text x="17" y="98" fill="#223544" font-family="Courier New, monospace" font-size="13">  "attempt": 1 }</text>
    </g>
  </g>
</svg>
